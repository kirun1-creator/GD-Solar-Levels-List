<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Levels List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #ff4500, #ff8c00);
      color: white;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(255, 69, 0, 0.3);
    }
    header h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    header p {
      margin-top: 10px;
      font-size: 1.1rem;
      opacity: 0.9;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    /* Navigation Bar */
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    .nav-btn {
      background-color: #1f2833;
      color: #66fcf1;
      border: 2px solid #ff4500;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn.active, .nav-btn:hover {
      background-color: #ff4500;
      color: white;
    }

    /* Cards Layout */
    .card {
      background-color: #1f2833;
      border-left: 6px solid #ff4500;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
    }
    .card-rank {
      font-size: 2rem;
      font-weight: bold;
      color: #ff8c00;
      width: 60px;
    }
    .card-info {
      flex-grow: 1;
    }
    .card-title {
      font-size: 1.4rem;
      color: #66fcf1;
      margin-bottom: 5px;
    }
    .card-subtitle {
      font-size: 0.95rem;
      color: #c5c6c7;
    }
    .card-detail {
      font-size: 0.85rem;
      color: #45a29e;
      margin-top: 4px;
    }
    .points-badge {
      color: #ff8c00;
      font-weight: bold;
      margin-left: 6px;
    }
    .video-btn {
      background-color: #ff4500;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .video-btn:hover {
      background-color: #e03e00;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>☀️ Solar Levels List</h1>
      <p>The official rankings for the hardest demons</p>
    </header>

    <!-- Navigation buttons to switch tabs -->
    <div class="nav-bar">
      <button class="nav-btn active" id="list-tab-btn" onclick="showTab('list')">Demon List</button>
      <button class="nav-btn" id="leaderboard-tab-btn" onclick="showTab('leaderboard')">Leaderboards</button>
    </div>

    <!-- Main view containers -->
    <main id="list-container"></main>
    <main id="leaderboard-container" style="display: none;"></main>
  </div>

  <script>
    // YOUR LEVELS ARRAY
    const solarLevels = [
      {
        rank: 1,
        name: "Exreme Robot",
        creator: "Kirun1001",
        verifier: "Kirun1001",
        ytLink: "https://youtu.be/3hWNV8ihL4U?si=URsDoeTyNmqLXgEM"
      },
      {
        rank: 2,
        name: "-",
        creator: "-",
        verifier: "-",
        ytLink: "https://www.youtube.com"
      },
      {
        rank: 3,
        name: "-",
        creator: "-",
        verifier: "-",
        ytLink: "https://www.youtube.com"
      }
    ];

    // 1. Render the Demon List
    function renderList() {
      const listContainer = document.getElementById('list-container');
      listContainer.innerHTML = '';

      solarLevels.forEach(level => {
        const points = (151 - level.rank).toFixed(2);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-rank">#${level.rank}</div>
          <div class="card-info">
            <div class="card-title">${level.name}</div>
            <div class="card-subtitle">Created by <strong>${level.creator}</strong></div>
            <div class="card-detail">Verified by ${level.verifier} | <span class="points-badge">${points} pts</span></div>
          </div>
          <a href="${level.ytLink}" target="_blank" class="video-btn">Watch Video</a>
        `;
        listContainer.appendChild(card);
      });
    }

    // 2. Render the Leaderboard automatically based on player points
    function renderLeaderboard() {
      const lbContainer = document.getElementById('leaderboard-container');
      lbContainer.innerHTML = '';

      const playerScores = {};

      // Calculate total points per verifier (ignoring placeholders)
      solarLevels.forEach(level => {
        if (level.verifier && level.verifier.trim() !== "-") {
          const points = 151 - level.rank;
          playerScores[level.verifier] = (playerScores[level.verifier] || 0) + points;
        }
      });

      // Sort players by highest points
      const sortedPlayers = Object.keys(playerScores)
        .map(name => ({ name, points: playerScores[name] }))
        .sort((a, b) => b.points - a.points);

      if (sortedPlayers.length === 0) {
        lbContainer.innerHTML = '<p style="text-align:center; padding: 20px;">No player records found yet.</p>';
        return;
      }

      sortedPlayers.forEach((player, index) => {
        const rank = index + 1;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-rank">#${rank}</div>
          <div class="card-info">
            <div class="card-title">${player.name}</div>
            <div class="card-detail"><span class="points-badge" style="margin-left:0;">${player.points.toFixed(2)} total pts</span></div>
          </div>
        `;
        lbContainer.appendChild(card);
      });
    }

    // 3. Switch between tabs
    function showTab(tabName) {
      const listTab = document.getElementById('list-container');
      const lbTab = document.getElementById('leaderboard-container');
      const listBtn = document.getElementById('list-tab-btn');
      const lbBtn = document.getElementById('leaderboard-tab-btn');

      if (tabName === 'list') {
        listTab.style.display = 'block';
        lbTab.style.display = 'none';
        listBtn.classList.add('active');
        lbBtn.classList.remove('active');
      } else {
        listTab.style.display = 'none';
        lbTab.style.display = 'block';
        lbBtn.classList.add('active');
        listBtn.classList.remove('active');
      }
    }

    // Initial Load
    renderList();
    renderLeaderboard();
  </script>

</body>
</html>
