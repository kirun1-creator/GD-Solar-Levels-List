<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Levels List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #ff4500, #ff8c00);
      color: white;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(255, 69, 0, 0.3);
    }
    header h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    header p {
      margin-top: 10px;
      font-size: 1.1rem;
      opacity: 0.9;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .level-card {
      background-color: #1f2833;
      border-left: 6px solid #ff4500;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .level-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
    }
    .level-rank {
      font-size: 2rem;
      font-weight: bold;
      color: #ff8c00;
      width: 60px;
    }
    .level-info {
      flex-grow: 1;
    }
    .level-title {
      font-size: 1.4rem;
      color: #66fcf1;
      margin-bottom: 5px;
    }
    .level-author {
      font-size: 0.95rem;
      color: #c5c6c7;
    }
    .level-verifier {
      font-size: 0.85rem;
      color: #45a29e;
      margin-top: 4px;
    }
    .video-btn {
      background-color: #ff4500;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .video-btn:hover {
      background-color: #e03e00;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>☀️ Solar Levels List</h1>
      <p>The official rankings for the hardest solar demons</p>
    </header>

    <main id="list-container">
      <!-- Level items will be inserted here dynamically -->
    </main>
  </div>

  <script><script>
  // ==========================================
  // 1. DATA CONFIGURATION (EDIT YOUR LEVELS HERE)
  // ==========================================
  const solarLevels = [
    {
      rank: 1,
      name: "Extreme Robot",
      creator: "Kirun1001",
      verifier: "Kirun1001",
      ytLink: "https://www.youtube.com",
      victors: ["Trick", "Zoink", "Doggie"] // List of people who beat it
    },
    {
      rank: 2,
      name: "-",
      creator: "-",
      verifier: "-",
      ytLink: "https://www.youtube.com",
      victors: ["Player1", "Zoink"]
    },
    {
      rank: 3,
      name:"-",
      creator: "Subtle",
      verifier: "Player2",
      ytLink: "https://www.youtube.com",
      victors: ["Player2", "Trick"]
    }
  ];

  // ==========================================
  // 2. FORMULA FOR LEVEL POINTS
  // ==========================================
  function calculatePoints(rank, totalLevels) {
    // Rank 1 gives 100 points, scaling down smoothly for lower ranks
    const basePoints = 100;
    const points = basePoints * Math.pow(0.85, rank - 1);
    return Math.round(points * 10) / 10; // Round to 1 decimal place
  }

  // Calculate points for all levels
  solarLevels.forEach(level => {
    level.points = calculatePoints(level.rank, solarLevels.length);
  });

  // ==========================================
  // 3. RENDER THE LEVEL LIST
  // ==========================================
  function renderLevels() {
    const container = document.getElementById('list-container');
    container.innerHTML = ''; // Clear container

    solarLevels.forEach(level => {
      const card = document.createElement('div');
      card.className = 'level-card';
      card.innerHTML = `
        <div class="level-rank">#${level.rank}</div>
        <div class="level-info">
          <div class="level-title">${level.name}</div>
          <div class="level-author">Created by <strong>${level.creator}</strong></div>
          <div class="level-verifier">Verified by ${level.verifier} | <span style="color: #ff8c00; font-weight: bold;">${level.points} pts</span></div>
        </div>
        <a href="${level.ytLink}" target="_blank" class="video-btn">Watch Video</a>
      `;
      container.appendChild(card);
    });
  }

  // ==========================================
  // 4. STATS VIEWER (PLAYER LEADERBOARD)
  // ==========================================
  function renderStatsViewer() {
    // Map to keep track of player total points
    const players = {};

    solarLevels.forEach(level => {
      // Give points to the verifier
      if (level.verifier) {
        players[level.verifier] = (players[level.verifier] || 0) + level.points;
      }
      // Give points to victors
      if (level.victors) {
        level.victors.forEach(victor => {
          if (victor !== level.verifier) { // Avoid double-counting verifier
            players[victor] = (players[victor] || 0) + level.points;
          }
        });
      }
    });

    // Sort players by total points (highest first)
    const leaderboard = Object.keys(players)
      .map(name => ({ name, points: Math.round(players[name] * 10) / 10 }))
      .sort((a, b) => b.points - a.points);

    // Create Stats Section in HTML
    const statsContainer = document.createElement('div');
    statsContainer.style.marginTop = '40px';
    statsContainer.style.padding = '20px';
    statsContainer.style.backgroundColor = '#1f2833';
    statsContainer.style.borderRadius = '8px';
    statsContainer.style.borderLeft = '6px solid #66fcf1';

    let statsHTML = '<h2 style="color: #66fcf1; margin-bottom: 15px;">📊 Player Stats Leaderboard</h2>';
    statsHTML += '<ol style="padding-left: 20px;">';

    leaderboard.forEach((player, index) => {
      statsHTML += `
        <li style="margin-bottom: 8px; font-size: 1.1rem;">
          <strong>${player.name}</strong> — <span style="color: #ff8c00;">${player.points} Points</span>
        </li>
      `;
    });

    statsHTML += '</ol>';
    statsContainer.innerHTML = statsHTML;

    // Append to main page
    document.querySelector('.container').appendChild(statsContainer);
  }

  // Run functions when page loads
  renderLevels();
  renderStatsViewer();
</script>

  </script>

</body>
</html>
