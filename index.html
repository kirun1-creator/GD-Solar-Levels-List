<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Levels List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
    header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #ff4500, #ff8c00); color: white; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(255, 69, 0, 0.3); }
    header h1 { font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase; }
    header p { margin-top: 10px; font-size: 1.1rem; opacity: 0.9; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .nav-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .nav-btn { background-color: #1f2833; color: #66fcf1; border: 2px solid #ff4500; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
    .nav-btn.active, .nav-btn:hover { background-color: #ff4500; color: white; }
    .submit-btn { background-color: #5865F2; color: white; border: 2px solid #5865F2; text-decoration: none; display: inline-block; }
    .submit-btn:hover { background-color: #4752C4; border-color: #4752C4; }

    .search-container { position: relative; margin-bottom: 25px; }
    .search-input { width: 100%; padding: 14px 45px 14px 18px; background-color: #1f2833; border: 2px solid #45a29e; border-radius: 8px; color: #ffffff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: #ff4500; }
    .search-clear { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #8892b0; font-size: 1.4rem; cursor: pointer; display: none; }
    .search-clear:hover { color: #ff4500; }

    .card { background-color: #1f2833; border-left: 6px solid #ff4500; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5); }
    .clickable-card { cursor: pointer; }
    .card-rank { font-size: 2rem; font-weight: bold; color: #ff8c00; min-width: 45px; text-align: center; }
    
    .level-thumb { width: 120px; height: 70px; border-radius: 6px; object-fit: cover; border: 1px solid #ff4500; background-color: #0b0c10; flex-shrink: 0; }
    .card-info { flex-grow: 1; }
    .card-title { font-size: 1.3rem; color: #66fcf1; margin-bottom: 3px; }
    .card-subtitle { font-size: 0.9rem; color: #c5c6c7; }
    .card-detail { font-size: 0.85rem; color: #45a29e; margin-top: 4px; }
    .level-id-badge { font-size: 0.8rem; color: #8892b0; margin-top: 4px; }
    .points-badge { color: #ff8c00; font-weight: bold; margin-left: 4px; }
    .video-btn { background-color: #ff4500; color: white; text-decoration: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; transition: background 0.2s; flex-shrink: 0; }
    .video-btn:hover { background-color: #e03e00; }
    
    .small-yt-btn { background-color: #ff0000; color: white; text-decoration: none; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-left: 10px; transition: background 0.2s; }
    .small-yt-btn:hover { background-color: #cc0000; }

    .team-section { margin-bottom: 30px; }
    .team-subheading { font-size: 1.5rem; color: #ff8c00; border-bottom: 2px solid #ff4500; padding-bottom: 8px; margin-bottom: 15px; }
    .team-card { background-color: #1f2833; border-left: 4px solid #66fcf1; border-radius: 6px; padding: 15px 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background-color: #1f2833; border: 2px solid #ff4500; border-radius: 12px; padding: 30px; max-width: 500px; width: 100%; position: relative; box-shadow: 0 10px 30px rgba(255, 69, 0, 0.4); }
    .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; color: #c5c6c7; cursor: pointer; font-weight: bold; }
    .modal-close:hover { color: #ff4500; }
    .modal-title { font-size: 1.8rem; color: #66fcf1; margin-bottom: 5px; }
    .modal-stats { font-size: 1rem; color: #ff8c00; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #45a29e; }
    .modal-list { list-style: none; max-height: 250px; overflow-y: auto; }
    .modal-item { background: #0b0c10; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    @media (max-width: 600px) {
      .card { flex-wrap: wrap; }
      .level-thumb { width: 100%; height: 140px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>☀️ Solar Levels List</h1>
      <p>The official rankings for the hardest demons</p>
    </header>

    <div class="nav-bar">
      <button class="nav-btn active" id="list-tab-btn" onclick="showTab('list')">Demon List</button>
      <button class="nav-btn" id="leaderboard-tab-btn" onclick="showTab('leaderboard')">Leaderboards</button>
      <button class="nav-btn" id="team-tab-btn" onclick="showTab('team')">List Team</button>
      <a href="https://discord.gg/8rf7NXr6uF" target="_blank" class="nav-btn submit-btn">Submit Record</a>
    </div>

    <div class="search-container" id="search-box">
      <input type="text" id="search-bar" class="search-input" placeholder="Search levels, creators, IDs..." oninput="handleSearch()">
      <span class="search-clear" id="search-clear-btn" onclick="clearSearch()">&times;</span>
    </div>

    <main id="list-container"></main>
    <main id="leaderboard-container" style="display: none;"></main>
    
    <main id="team-container" style="display: none;">
      <div class="team-section">
        <h2 class="team-subheading">🛠️ List Helpers</h2>
        <div class="team-card">
          <strong style="color:#66fcf1; font-size: 1.1rem;">Kirun1001</strong>
          <span style="color:#45a29e; font-size: 0.9rem;">Helper</span>
        </div>
      </div>

      <div class="team-section">
        <h2 class="team-subheading">🛡️ List Moderators</h2>
        <div class="team-card">
          <strong style="color:#66fcf1; font-size: 1.1rem;">Kirun1001</strong>
          <span style="color:#45a29e; font-size: 0.9rem;">Moderator</span>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="profile-modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal('profile-modal')">&times;</span>
      <div class="modal-title" id="modal-player-name">Player Profile</div>
      <div class="modal-stats" id="modal-player-stats">0 Points</div>
      <h3 style="color: #c5c6c7; margin-bottom: 10px;">Completed / Verified Levels:</h3>
      <ul class="modal-list" id="modal-level-list"></ul>
    </div>
  </div>

  <div class="modal-overlay" id="level-modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal('level-modal')">&times;</span>
      <div class="modal-title" id="modal-level-name">Level Info</div>
      <div class="modal-stats" id="modal-level-stats">ID: - | Points: 0</div>
      <h3 style="color: #c5c6c7; margin-bottom: 10px;">Records / Victors:</h3>
      <ul class="modal-list" id="modal-victor-list"></ul>
    </div>
  </div>

  <script>
    const solarLevels = [
      {
        rank: 1,
        name: "Exreme Robot",
        creator: "Kirun1001",
        verifier: "Kirun1001",
        id: "146732262",
        ytLink: "https://youtu.be/3hWNV8ihL4U?si=URsDoeTyNmqLXgEM",
        victors: [] 
      },
      {
        rank: 2,
        name: "-",
        creator: "-",
        verifier: "-",
        id: "-",
        ytLink: "https://www.youtube.com",
        victors: []
      },
      {
        rank: 3,
        name: "-",
        creator: "-",
        verifier: "-",
        id: "-",
        ytLink: "https://www.youtube.com",
        victors: []
      }
    ];

    let currentTab = 'list';

    function getYouTubeVideoId(url) {
      if (!url) return null;
      const match = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
      return match ? match[1] : null;
    }

    function renderList(query = '') {
      const listContainer = document.getElementById('list-container');
      listContainer.innerHTML = '';
      const cleanQuery = query.toLowerCase().trim();

      const filteredLevels = solarLevels.filter(lvl => 
        lvl.name.toLowerCase().includes(cleanQuery) ||
        lvl.creator.toLowerCase().includes(cleanQuery) ||
        lvl.verifier.toLowerCase().includes(cleanQuery) ||
        lvl.id.toLowerCase().includes(cleanQuery)
      );

      if (filteredLevels.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; padding: 30px; color:#8892b0;">No levels match your search.</p>';
        return;
      }

      filteredLevels.forEach(level => {
        const points = (151 - level.rank).toFixed(2);
        const videoId = getYouTubeVideoId(level.ytLink);
        const thumbUrl = videoId 
          ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` 
          : 'https://via.placeholder.com/120x70/1f2833/ff4500?text=No+Thumb';

        const card = document.createElement('div');
        card.className = 'card clickable-card';
        card.onclick = (e) => {
          if (e.target.classList.contains('video-btn')) return;
          openLevelModal(level);
        };

        card.innerHTML = `
          <div class="card-rank">#${level.rank}</div>
          <img src="${thumbUrl}" alt="${level.name} Thumbnail" class="level-thumb">
          <div class="card-info">
            <div class="card-title">${level.name}</div>
            <div class="card-subtitle">Created by <strong>${level.creator}</strong></div>
            <div class="card-detail">Verified by ${level.verifier} | <span class="points-badge">${points} pts</span></div>
            <div class="level-id-badge">ID: ${level.id} (Tap to view victors)</div>
          </div>
          <a href="${level.ytLink}" target="_blank" class="video-btn">Watch Video</a>
        `;
        listContainer.appendChild(card);
      });
    }

    function renderLeaderboard(query = '') {
      const lbContainer = document.getElementById('leaderboard-container');
      lbContainer.innerHTML = '';
      const cleanQuery = query.toLowerCase().trim();

      const playerScores = {};

      solarLevels.forEach(level => {
        const points = 151 - level.rank;

        if (level.verifier && level.verifier.trim() !== "-") {
          playerScores[level.verifier] = (playerScores[level.verifier] || 0) + points;
        }

        if (level.victors && Array.isArray(level.victors)) {
          level.victors.forEach(victor => {
            const vName = typeof victor === 'object' ? victor.name : victor;
            if (vName && vName.trim() !== "-" && vName !== level.verifier) {
              playerScores[vName] = (playerScores[vName] || 0) + points;
            }
          });
        }
      });

      const sortedPlayers = Object.keys(playerScores)
        .map(name => ({ name, points: playerScores[name] }))
        .filter(player => player.name.toLowerCase().includes(cleanQuery))
        .sort((a, b) => b.points - a.points);

      if (sortedPlayers.length === 0) {
        lbContainer.innerHTML = '<p style="text-align:center; padding: 30px; color:#8892b0;">No players match your search.</p>';
        return;
      }

      sortedPlayers.forEach((player, index) => {
        const rank = index + 1;
        const card = document.createElement('div');
        card.className = 'card clickable-card';
        card.onclick = () => openProfileModal(player.name, player.points);
        card.innerHTML = `
          <div class="card-rank">#${rank}</div>
          <div class="card-info">
            <div class="card-title">${player.name}</div>
            <div class="card-detail"><span class="points-badge" style="margin-left:0;">${player.points.toFixed(2)} total pts</span> (Tap to view levels)</div>
          </div>
        `;
        lbContainer.appendChild(card);
      });
    }

    function handleSearch() {
      const query = document.getElementById('search-bar').value;
      const clearBtn = document.getElementById('search-clear-btn');
      
      clearBtn.style.display = query.length > 0 ? 'block' : 'none';

      if (currentTab === 'list') {
        renderList(query);
      } else if (currentTab === 'leaderboard') {
        renderLeaderboard(query);
      }
    }

    function clearSearch() {
      const searchBar = document.getElementById('search-bar');
      searchBar.value = '';
      handleSearch();
      searchBar.focus();
    }

    function openLevelModal(level) {
      const points = (151 - level.rank).toFixed(2);
      document.getElementById('modal-level-name').innerText = `#${level.rank} ${level.name}`;
      document.getElementById('modal-level-stats').innerText = `ID: ${level.id} | ${points} pts`;

      const victorListEl = document.getElementById('modal-victor-list');
      victorListEl.innerHTML = '';

      const allVictors = [];

      if (level.verifier && level.verifier.trim() !== "-") {
        allVictors.push({ name: level.verifier, role: "Verifier", link: level.ytLink });
      }

      if (level.victors && Array.isArray(level.victors)) {
        level.victors.forEach(v => {
          const vName = typeof v === 'object' ? v.name : v;
          const vLink = typeof v === 'object' ? v.ytLink : '';
          
          if (vName && vName.trim() !== "-" && vName !== level.verifier) {
            allVictors.push({ name: vName, role: "Victor", link: vLink });
          }
        });
      }

      if (allVictors.length === 0) {
        victorListEl.innerHTML = '<li class="modal-item" style="color:#8892b0;">No victors recorded yet.</li>';
      } else {
        allVictors.forEach(item => {
          const li = document.createElement('li');
          li.className = 'modal-item';
          
          const watchBtn = (item.link && item.link.trim() !== "") 
            ? `<a href="${item.link}" target="_blank" class="small-yt-btn">Watch</a>` 
            : '';

          li.innerHTML = `
            <div>
              <strong style="color:#66fcf1;">${item.name}</strong>
              ${watchBtn}
            </div>
            <span style="color:#ff8c00; font-weight:bold; font-size: 0.85rem;">${item.role}</span>
          `;
          victorListEl.appendChild(li);
        });
      }

      document.getElementById('level-modal').style.display = 'flex';
    }

    function openProfileModal(playerName, totalPoints) {
      document.getElementById('modal-player-name').innerText = playerName;
      document.getElementById('modal-player-stats').innerText = `Total Score: ${totalPoints.toFixed(2)} pts`;
      
      const levelListEl = document.getElementById('modal-level-list');
      levelListEl.innerHTML = '';

      const completedLevels = solarLevels.filter(lvl => {
        const isVerifier = lvl.verifier === playerName;
        const isVictor = lvl.victors && lvl.victors.some(v => (typeof v === 'object' ? v.name : v) === playerName);
        return isVerifier || isVictor;
      });

      completedLevels.forEach(lvl => {
        const pts = (151 - lvl.rank).toFixed(2);
        const role = (lvl.verifier === playerName) ? "Verifier" : "Victor";
        
        let pLink = "";
        if (role === "Verifier") {
          pLink = lvl.ytLink;
        } else if (lvl.victors) {
          const vMatch = lvl.victors.find(v => (typeof v === 'object' ? v.name : v) === playerName);
          if (vMatch && typeof vMatch === 'object') pLink = vMatch.ytLink;
        }

        const watchBtn = (pLink && pLink.trim() !== "") 
          ? `<a href="${pLink}" target="_blank" class="small-yt-btn">Watch</a>` 
          : '';

        const li = document.createElement('li');
        li.className = 'modal-item';
        li.innerHTML = `
          <div>
            <strong style="color:#66fcf1;">#${lvl.rank} ${lvl.name}</strong>
            ${watchBtn}
            <div style="font-size:0.8rem; color:#c5c6c7; margin-top:2px;">By ${lvl.creator} (${role})</div>
          </div>
          <span style="color:#ff8c00; font-weight:bold;">${pts} pts</span>
        `;
        levelListEl.appendChild(li);
      });

      document.getElementById('profile-modal').style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    window.onclick = function(event) {
      const profileModal = document.getElementById('profile-modal');
      const levelModal = document.getElementById('level-modal');
      if (event.target === profileModal) closeModal('profile-modal');
      if (event.target === levelModal) closeModal('level-modal');
    };

    function showTab(tabName) {
      currentTab = tabName;
      
      const listTab = document.getElementById('list-container');
      const lbTab = document.getElementById('leaderboard-container');
      const teamTab = document.getElementById('team-container');
      const searchBox = document.getElementById('search-box');
      const searchBar = document.getElementById('search-bar');

      const listBtn = document.getElementById('list-tab-btn');
      const lbBtn = document.getElementById('leaderboard-tab-btn');
      const teamBtn = document.getElementById('team-tab-btn');

      listTab.style.display = 'none';
      lbTab.style.display = 'none';
      teamTab.style.display = 'none';

      listBtn.classList.remove('active');
      lbBtn.classList.remove('active');
      teamBtn.classList.remove('active');

      if (tabName === 'list') {
        listTab.style.display = 'block';
        listBtn.classList.add('active');
        searchBox.style.display = 'block';
        searchBar.placeholder = "Search levels, creators, IDs...";
        renderList(searchBar.value);
      } else if (tabName === 'leaderboard') {
        lbTab.style.display = 'block';
        lbBtn.classList.add('active');
        searchBox.style.display = 'block';
        searchBar.placeholder = "Search player names...";
        renderLeaderboard(searchBar.value);
      } else if (tabName === 'team') {
        teamTab.style.display = 'block';
        teamBtn.classList.add('active');
        searchBox.style.display = 'none';
      }
    }

    renderList();
    renderLeaderboard();
  </script>

</body>
</html>
