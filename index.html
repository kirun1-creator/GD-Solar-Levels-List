<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Levels List</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #ff4500, #ff8c00); color: white; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(255, 69, 0, 0.3); }
header h1 { font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase; }
header p { margin-top: 10px; font-size: 1.1rem; opacity: 0.9; }
.container { max-width: 800px; margin: 0 auto; }
.nav-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.nav-btn { background-color: #1f2833; color: #66fcf1; border: 2px solid #ff4500; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
.nav-btn.active, .nav-btn:hover { background-color: #ff4500; color: white; }
.submit-btn { background-color: #5865F2; color: white; border: 2px solid #5865F2; text-decoration: none; display: inline-block; }
.submit-btn:hover { background-color: #4752C4; border-color: #4752C4; }
.search-container { position: relative; margin-bottom: 25px; }
.search-input { width: 100%; padding: 14px 45px 14px 18px; background-color: #1f2833; border: 2px solid #45a29e; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
.search-input:focus { border-color: #ff4500; }
.search-clear { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #8892b0; font-size: 1.4rem; cursor: pointer; display: none; }
.search-clear:hover { color: #ff4500; }
.card { background-color: #1f2833; border-left: 6px solid #ff4500; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5); }
.card-rank { font-size: 2rem; font-weight: bold; color: #ff8c00; min-width: 45px; text-align: center; }
.level-thumb { width: 120px; height: 70px; border-radius: 6px; object-fit: cover; border: 1px solid #ff4500; background-color: #0b0c10; flex-shrink: 0; }
.card-info { flex-grow: 1; }
.card-title { font-size: 1.3rem; color: #66fcf1; margin-bottom: 3px; }
.card-subtitle { font-size: 0.9rem; }
.card-detail { font-size: 0.85rem; color: #45a29e; margin-top: 4px; }
.level-id-badge { font-size: 0.8rem; color: #8892b0; margin-top: 4px; }
.points-badge { color: #ff8c00; font-weight: bold; margin-left: 4px; }
.video-btn { background-color: #ff4500; color: white; text-decoration: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; flex-shrink: 0; }
.video-btn:hover { background-color: #e03e00; }
.small-yt-btn { background-color: #f00; color: white; text-decoration: none; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-left: 10px; }
.small-yt-btn:hover { background-color: #c00; }
.empty, .error { text-align: center; padding: 30px; color: #8892b0; }
.error { color: #ff4500; }
.team-section { margin-bottom: 30px; }
.team-subheading { font-size: 1.5rem; color: #ff8c00; border-bottom: 2px solid #ff4500; padding-bottom: 8px; margin-bottom: 15px; }
.team-card { background-color: #1f2833; border-left: 4px solid #66fcf1; border-radius: 6px; padding: 15px 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.team-card strong { color: #66fcf1; font-size: 1.1rem; }
.team-card span { color: #45a29e; font-size: 0.9rem; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
.modal-content { background-color: #1f2833; border: 2px solid #ff4500; border-radius: 12px; padding: 30px; max-width: 500px; width: 100%; position: relative; box-shadow: 0 10px 30px rgba(255, 69, 0, 0.4); }
.modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; font-weight: bold; }
.modal-close:hover { color: #ff4500; }
.modal-title { font-size: 1.8rem; color: #66fcf1; margin-bottom: 5px; }
.modal-stats { color: #ff8c00; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #45a29e; }
.modal-content h3 { margin-bottom: 10px; }
.modal-list { list-style: none; max-height: 250px; overflow-y: auto; }
.modal-item { background: #0b0c10; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.modal-item b { color: #66fcf1; }
.modal-item .role { color: #ff8c00; font-weight: bold; font-size: 0.85rem; }
@media (max-width: 600px) { .card { flex-wrap: wrap; } .level-thumb { width: 100%; height: 140px; } }
</style>
</head>
<body>
<div class="container">
  <header><h1 id="site-title"></h1><p id="site-subtitle"></p></header>
  <div class="nav-bar">
    <button class="nav-btn active" data-tab="list">Demon List</button>
    <button class="nav-btn" data-tab="leaderboard">Leaderboards</button>
    <button class="nav-btn" data-tab="team">List Team</button>
    <a id="submit-link" href="#" target="_blank" rel="noopener" class="nav-btn submit-btn">Submit Record</a>
  </div>
  <div class="search-container" id="search-box">
    <input type="text" id="search-bar" class="search-input">
    <span class="search-clear" id="search-clear-btn">&times;</span>
  </div>
  <main id="list"></main>
  <main id="leaderboard" style="display:none"></main>
  <main id="team" style="display:none"></main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <span class="modal-close" id="modal-close">&times;</span>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-stats" id="modal-stats"></div>
    <h3 id="modal-heading"></h3>
    <ul class="modal-list" id="modal-list"></ul>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
